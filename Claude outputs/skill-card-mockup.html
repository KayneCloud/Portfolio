<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Card Redesign</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #06141B; color: #9BA8AB; font-family: Arial, Helvetica, sans-serif; padding: 2.5rem 1.5rem 4rem; }
  body::before { content: ""; position: fixed; left: 50%; bottom: -55vh; width: 140vw; height: 80vh; transform: translateX(-50%);
                 background: radial-gradient(closest-side, rgba(74,92,106,.55), rgba(37,55,69,.25) 55%, transparent 100%); pointer-events: none; }
  .wrap { margin: 0 auto; max-width: 50rem; position: relative; }
  .intro { font-size: .875rem; margin-bottom: 2rem; }
  .intro strong { color: #CCD0CF; }

  /* section heading, as on your Resume page */
  .section h2 { color: #CCD0CF; font-size: 2rem; letter-spacing: -.02em; line-height: 1.1; text-transform: uppercase; }
  .dot-accent { color: #4A5C6A; }
  .skill-grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(2, 1fr); margin-top: 1.5rem; align-items: start; }

  /* ---------- NEW SKILL CARD (same family as the project cards) ---------- */
  .card {
    background: linear-gradient(180deg, rgba(37,55,69,.55), rgba(17,33,45,.9) 40%);
    backdrop-filter: blur(12px);
    border: 1px solid #253745;
    border-radius: 1.25rem;
    overflow: hidden;
    position: relative;
    transition: border-color .25s;
  }
  .card:hover { border-color: #4A5C6A; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
                  background: linear-gradient(90deg, transparent, rgba(204,208,207,.5), transparent); }


  .card-body { padding: 1.5rem 1.75rem 1.75rem; }
  .card-body h3 { color: #CCD0CF; font-size: 1.5rem; letter-spacing: -.02em; text-transform: uppercase; }
  .card-list { border-top: 1px solid #253745; list-style: none; margin-top: 1rem; }

  /* soft skills: one per row, small square marker like the timeline dots */
  .card-list li { align-items: center; border-bottom: 1px solid #25374580; color: #CCD0CF; display: flex; font-size: .875rem; gap: .75rem; padding: .75rem 0; }
  .card-list li:last-child { border-bottom: 0; padding-bottom: 0; }
  .card-list li::before { background: #CCD0CF; content: ""; flex-shrink: 0; height: .5rem; width: .5rem; }

  /* languages: name, level pill, and a 5-step level bar */
  .lang-list li { display: grid; gap: .5rem 1rem; grid-template-columns: 1fr auto; }
  .lang-list li::before { display: none; }
  .lang-name { font-size: 1rem; font-weight: bold; }
  .lang-level { align-self: center; background: #253745; border: 1px solid #4A5C6A; border-radius: 999px; color: #CCD0CF; font-size: .75rem; padding: .25rem .75rem; }
  .lang-bar { display: grid; gap: .25rem; grid-column: 1 / -1; grid-template-columns: repeat(5, 1fr); }
  .lang-bar span { background: #CCD0CF; border-radius: 999px; height: .25rem; }
  .lang-bar span.off { background: #253745; }
  /* --------------------------------------------------------------------- */

  @media (max-width: 700px) {
    .skill-grid { grid-template-columns: 1fr; }
    .section h2 { font-size: 1.5rem; }
    .card-body { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
</style>
</head>
<body>
<div class="wrap">
  <p class="intro"><strong>New skill cards</strong> — same style as the redesigned project cards. Hover a card.</p>

  <section class="section">
    <h2>Soft skills &amp; languages<span class="dot-accent">.</span></h2>
    <div class="skill-grid">

      <article class="card">
        <div class="card-body">
          <h3>Soft skills<span class="dot-accent">.</span></h3>
          <ul class="card-list">
            <li>Adaptability</li>
            <li>Teamwork</li>
            <li>Curiosity</li>
            <li>Eagerness to learn</li>
            <li>Critical thinking</li>
          </ul>
        </div>
      </article>

      <article class="card">
        <div class="card-body">
          <h3>Languages<span class="dot-accent">.</span></h3>
          <ul class="card-list lang-list">
            <li>
              <span class="lang-name">English</span>
              <span class="lang-level">Native</span>
              <span class="lang-bar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
            </li>
            <li>
              <span class="lang-name">French</span>
              <span class="lang-level">Native</span>
              <span class="lang-bar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
            </li>
          </ul>
        </div>
      </article>

    </div>
  </section>
</div>
</body>
</html>
